[package]
name = "visp"
version = "0.1.0"
description = "Visp - 全离线、零成本、极简、跨平台的 AI 翻译助手"
authors = ["Visp Team"]
edition = "2021"

[lib]
name = "visp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }
cc = "1.1"

[dependencies]
tauri = { version = "2.2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-shell = "2.0"
tauri-plugin-global-shortcut = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.42", features = ["full"] }
anyhow = "1.0"
thiserror = "2.0"

# ML 推理
candle-core = "0.8"
candle-nn = "0.8"
candle-transformers = "0.8"
tokenizers = "0.21"

# ASR - Whisper via whisper.cpp (cross-platform)
whisper-rs = "0.16"

# 音频处理
cpal = "0.15"

# 系统集成
arboard = "3.4"
enigo = "0.2"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
fs_extra = "1.3"

# 配置管理
directories = "5.0"
dirs = "5.0"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2.0"

[dev-dependencies]
serial_test = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
